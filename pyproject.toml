[project]
name = "aswan"
dynamic = ["version", "description"]
authors = [{name = "Endre Márk Borza", email = "endremborza@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "sqlalchemy",
    "atqo>=2.0.0",
    "dirark>=0.2.0",
    "protocli",
]
scripts = {aswan = "aswan.cli:main"}
[project.optional-dependencies]
relay = ["flask", "flask-cors"]
soup = ["beautifulsoup4"]
browser = ["selenium"]
monitor = ["dash", "dash-bootstrap-components"]
legacy = ["pyyaml"]
test = ["branthebuilder", "pytest-timeout"]

[project.urls]
Homepage = "https://github.com/endremborza/aswan"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.uv.sources]
dirark = { path = "../dirark", editable = true }
atqo = { path = "../atqo", editable = true }
protocli = { path = "../protocli", editable = true }

[tool.pytest.ini_options]
addopts = "-s --timeout=30 --timeout-method=thread"

[tool.coverage.run]
# Scheduler workers run handler/session code in spawned mp.Process workers and
# the relay server in a thread inside them; measure both so the e2e tests
# credit that code instead of reporting it as dead.
source = ["aswan"]
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.ruff.lint]
select = ["E", "F", "I"]
