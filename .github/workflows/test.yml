name: Python Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: nanasess/setup-chromedriver@v2
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true
    - run: uv tool install branthebuilder
    - name: Install
      run: uv pip install --system -e .[test,monitor]
    - name: Test
      run: branb test --v
